title: Notes for Later
description: >-
  A blog of a new father's thoughts and considerations
author: Nicholas Ton
baseurl: "/XiuShen"
url: "https://nichkt.github.io"

permalink: /:title/

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
