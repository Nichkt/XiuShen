<header class="site-header">
  <div class="wrap">
    <div>
      <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
      {% if site.description %}<p class="site-tagline">{{ site.description }}</p>{% endif %}
    </div>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">Dark</button>
    </nav>
  </div>
</header>
